<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejemplos de Hipervínculos</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        h2 {
            color: #2c3e50;
        }
        a {
            color: #2980b9;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <h2>Hipervínculos en HTML</h2>

    <!-- Enlace a una página externa -->
    <p>
        <a href="https://www.google.com" target="_blank">Ir a Google</a>
        <!-- target="_blank" abre el enlace en una nueva pestaña -->
    </p>

    <!-- Enlace a una página interna (otra página en tu sitio) -->
    <p>
        <a href="index.html">Volver a la página de inicio</a>
    </p>

    <!-- Enlace a una sección de esta misma página (ancla) -->
    <p>
        <a href="#seccion-contacto">Ir a la sección de contacto</a>
    </p>

    <!-- Enlace para enviar un correo electrónico -->
    <p>
        <a href="mailto:ejemplo@correo.com">Enviar un correo</a>
    </p>

    <!-- Enlace para hacer una llamada (funciona en móviles) -->
    <p>
        <a href="tel:+123456789">Llamar al número +123456789</a>
    </p>

    <!-- Contenido de relleno para hacer scroll -->
    <div style="height: 400px;"></div>

    <!-- Sección destino del ancla -->
    <h3 id="seccion-contacto">Sección de Contacto</h3>
    <p>Gracias por visitar nuestra página. ¡Esperamos tu mensaje!</p>

</body>
</html>
